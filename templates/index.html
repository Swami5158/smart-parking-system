<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Let's Connect - Smart Parking Dashboard</title>
  <style>
    :root {
      --bg-color: #1a1a1a;
      --card-bg: #232323;
      --header-color: #0ff9d6;
      --text-color: #ffffff;
      --border-color: #333333;
      --available-slot: #5ade5a;
      --occupied-slot: #ff4f4f;
      --button-color: #0ff9d6;
      --button-hover: #0ccaaa;
    }
    * {
      margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h1, h2 {
      color: var(--header-color);
      margin-bottom: 15px;
    }
    .main-title {
      text-align: center;
      font-size: 2.5rem;
      padding: 15px 0;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }
    .dashboard-container {
      display: flex;
      flex: 1;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 20px;
    }
    .panel {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    .left-panel { flex: 2; min-width: 300px; }
    .right-panel { flex: 1; min-width: 250px; }
    .bottom-panel { width: 100%; margin-top: 20px; min-height: 150px; }

    .slots {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .slot {
      height: 60px;
      border-radius: 10px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .slot:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }
    .green { background-color: var(--available-slot); }
    .red { background-color: var(--occupied-slot); }
    .parking-icon { font-size: 1.2rem; margin-top: 5px; }

    .form-container {
      margin-top: 20px;
      padding: 15px;
      background-color: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }
    .form-title {
      margin-bottom: 15px;
      font-size: 1.2rem;
      color: var(--header-color);
    }
    select, input[type="file"], button {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 5px;
    }
    button {
      background-color: var(--button-color);
      color: var(--bg-color);
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover { background-color: var(--button-hover); }
    button:disabled { background-color: #555; cursor: not-allowed; }

    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }
    .qr-container img {
      width: 150px;
      height: 150px;
      margin-bottom: 10px;
    }
    .recent-parking-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    .recent-parking-table th, .recent-parking-table td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }
    .recent-parking-table th {
      color: var(--header-color);
      font-weight: bold;
    }

    @media (max-width: 992px) {
      .dashboard-container { flex-direction: column; }
      .left-panel, .right-panel { width: 100%; }
      .slots { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 600px) {
      .slots { grid-template-columns: repeat(2, 1fr); }
      .main-title { font-size: 1.8rem; }
      .panel { padding: 15px; }
      .qr-container img { width: 120px; height: 120px; }
    }
    .qr-container {
  margin-top: 20px;
  text-align: center;
}

.qr-container img {
  border: 2px solid #ccc;
  padding: 10px;
  background-color: #fff;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.receipt-link {
  display: block;
  margin-top: 10px;
  font-weight: bold;
  color: #1e90ff;
  text-decoration: underline;
}


  </style>
</head>
<body>
  <h1 class="main-title">Let's Connect - Smart Parking Dashboard</h1>
  <div class="dashboard-container">
    <!-- Left Panel -->
    <div class="panel left-panel">
      <h2>Parking Slots</h2>
      <div class="slots" id="slotsContainer"></div>
      <div class="form-container">
        <h3 class="form-title">Vehicle Entry/Exit</h3>
        <form id="uploadForm" enctype="multipart/form-data">
          <select name="mode" id="mode">
            <option value="entry">Entry</option>
            <option value="exit">Exit</option>
          </select>
          <input type="file" name="image" accept="image/*" required />
          <button type="submit">Upload Image</button>
        </form>
      </div>
    </div>

    <!-- Right Panel: Only QR -->
    <div class="panel right-panel">
      <h2>Exit QR</h2>
      <div class="qr-container" id="qrContainer"></div>
    </div>
  </div>

  <!-- Bottom Panel - Recent Parking -->
  <div class="panel bottom-panel">
    <h2>Recent Parking</h2>
    <div id="recentParkingContainer">
      <table class="recent-parking-table" id="recentParkingTable">
        <thead>
          <tr>
            <th>Slot</th>
            <th>Vehicle No.</th>
            <th>Entry Time</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="4">No recent parking data.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script>
  /* ------------------------------------------------------------------ *
   *  Global setup                                                      *
   * ------------------------------------------------------------------ */
  const parkingData = { slots: {}, occupiedSlots: {} };
  const slotsContainer     = document.getElementById('slotsContainer');
  const uploadForm         = document.getElementById('uploadForm');
  const qrContainer        = document.getElementById('qrContainer');
  const recentParkingTable = document.getElementById('recentParkingTable');

  function formatDateTime(d) {
    return d.toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
  }

  async function loadSlots() {
    try {
      const res = await fetch('/slots');
      if (!res.ok) throw new Error(`Failed to fetch slots: ${res.status}`);
      updateSlotsUI(await res.json());
      updateRecentParkings();
    } catch (err) { console.error(err); }
  }

  function updateSlotsUI(data) {
    slotsContainer.innerHTML = '';
    parkingData.slots = data;
    for (const [slot, status] of Object.entries(data)) {
      const d = document.createElement('div');
      d.className = `slot ${status}`;
      d.id        = `slot-${slot}`;
      d.innerHTML = `${slot}<div class="parking-icon">P</div>`;
      slotsContainer.appendChild(d);
    }
  }

  function updateRecentParkings() {
    const tb   = recentParkingTable.querySelector('tbody');
    const rows = Object.entries(parkingData.occupiedSlots);
    tb.innerHTML = rows.length === 0
      ? '<tr><td colspan="4">No recent parking data.</td></tr>'
      : rows.map(([slot, info]) => `
          <tr id="row-${info.plate}-${info.entryTime}">
            <td>${slot}</td>
            <td>${info.plate}</td>
            <td>${formatDateTime(new Date(info.entryTime))}</td>
            <td>Active</td>
          </tr>`).join('');
  }

  /* --- polling helpers --------------------------------------------- */
  let pollId = null;
  const startPolling = () => pollId = setInterval(loadSlots, 5000);
  const stopPolling  = () => { clearInterval(pollId); pollId = null; };

  loadSlots();   // first draw
  startPolling();

  /* ------------------------------------------------------------------ *
   *  Form submission                                                   *
   * ------------------------------------------------------------------ */
  uploadForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd   = new FormData(e.target);
    const mode = fd.get('mode');
    const url  = mode === 'entry' ? '/process_entry' : '/process_exit';
    const btn  = e.target.querySelector('button');

    btn.disabled = true;
    btn.innerText = 'Processing…';
    qrContainer.innerHTML = '';

    try {
      const res  = await fetch(url, { method: 'POST', body: fd });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      if (data.error) { alert(data.error); return; }

      /* ---------------- ENTRY ---------------- */
/* ---------------- ENTRY ---------------- */
if (mode === 'entry') {
  parkingData.occupiedSlots[data.slot] = {
    plate: data.plate, entryTime: new Date().toISOString()
  };
  loadSlots();

  // Show assigned slot name
  const slotMsg = document.createElement('p');
  slotMsg.id = 'slotAssignedMsg';
  slotMsg.innerText = `✅ Vehicle parked at slot ${data.slot}`;
  slotMsg.style.cssText = 'color:lightblue;font-weight:bold;margin-top:10px;';
  qrContainer.appendChild(slotMsg);

  // Auto-remove message after 5 seconds
  setTimeout(() => {
    slotMsg.remove();
  }, 5000);

  return;
}


      /* ---------------- EXIT ----------------- */
      stopPolling();           // pause auto‑refresh
      /* show QR & receipt */
      const qr = document.createElement('img');
      qr.src = data.qr_path; qr.alt = 'QR'; qr.style.width = '200px';
      qrContainer.appendChild(qr);

      const a  = document.createElement('a');
      a.href = data.receipt_url; a.target = '_blank';
      a.className = 'receipt-link'; a.innerText = 'Download Receipt';
      qrContainer.appendChild(a);

      /* ----- after 7 s: hide QR, remove row, flip colour, show msg ---- */
      setTimeout(() => {
        qrContainer.innerHTML = '';

        /* remove from internal store & table *now* */
        delete parkingData.occupiedSlots[data.slot_freed];
        updateRecentParkings();

        /* flip slot green */
        const d = document.getElementById(`slot-${data.slot_freed}`);
        if (d) { d.classList.remove('red'); d.classList.add('green'); }

        /* show success msg */
        const msg = document.createElement('p');
        msg.id='successMsg';
        msg.innerText='Payment successful!';
        msg.style.cssText='color:lightgreen;font-weight:bold;margin-top:10px;';
        qrContainer.appendChild(msg);

        /* ----- after 5 s: clear msg, reload, resume polling ---------- */
        setTimeout(() => {
          msg.remove();
          loadSlots();
          startPolling();
        }, 5000);

      }, 7000);  // QR visible 7 s
    } catch (err) {
      console.error('Upload failed:', err);
      alert('Something went wrong: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = 'Upload Image';
    }
  });
</script>



</body>
</html>
